name: ?? Deploy SmartOffice API to Azure (Optimized)

# ?? Déclencheurs
on:
  push:
    branches:
      - main
    paths:
      - 'SmartOfficeAPP/**'
      - 'infra/main-minimal.bicep'
      - '.github/workflows/deploy-azure-minimal.yml'
  workflow_dispatch: # Déploiement manuel

# ?? Permissions
permissions:
  contents: read
  id-token: write

# ?? Variables d'environnement
env:
  AZURE_WEBAPP_NAME: smartoffice-prod-api
  AZURE_WEBAPP_PACKAGE_PATH: './SmartOfficeAPP'
  DOTNET_VERSION: '9.0.x'
  RESOURCE_GROUP: smartoffice-prod-rg
  LOCATION: eastus

jobs:
  # ========================================
  # JOB 1: Build .NET Application
  # ========================================
  build:
    name: ?? Build .NET 9 Application
    runs-on: ubuntu-latest
    
    steps:
      - name: ?? Checkout Code
        uses: actions/checkout@v4

      - name: ?? Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: ?? Restore Dependencies
        run: dotnet restore ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/SmartOfficeAPP.csproj

      - name: ??? Build Application
        run: dotnet build ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/SmartOfficeAPP.csproj --configuration Release --no-restore

      - name: ?? Publish Application
        run: dotnet publish ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/SmartOfficeAPP.csproj --configuration Release --no-build --output ./publish

      - name: ?? Upload Artifact for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish
          retention-days: 1 # ?? Garde seulement 1 jour pour économiser

  # ========================================
  # JOB 2: Deploy Infrastructure (Bicep)
  # ========================================
  deploy-infrastructure:
    name: ??? Deploy Azure Infrastructure
    runs-on: ubuntu-latest
    needs: build
    outputs:
      webapp-name: ${{ steps.deploy-bicep.outputs.webAppName }}
      webapp-url: ${{ steps.deploy-bicep.outputs.webAppUrl }}
    
    steps:
      - name: ?? Checkout Code
        uses: actions/checkout@v4

      - name: ?? Azure Login (Federated Identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ??? Deploy Bicep Infrastructure
        id: deploy-bicep
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ env.RESOURCE_GROUP }}
          template: ./infra/main-minimal.bicep
          parameters: >
            appName=smartoffice
            environment=prod
            location=${{ env.LOCATION }}
            jwtSecret=${{ secrets.JWT_SECRET }}
            iotHubConnectionString=${{ secrets.IOT_HUB_CONNECTION_STRING }}
            iotHubEventHubConnectionString=${{ secrets.IOT_HUB_EVENTHUB_CONNECTION_STRING }}
            storageConnectionString=${{ secrets.STORAGE_CONNECTION_STRING }}
            postgresqlConnectionString=${{ secrets.POSTGRESQL_CONNECTION_STRING }}
          failOnStdErr: false

      - name: ?? Display Deployment Outputs
        run: |
          echo "? Déploiement infrastructure terminé"
          echo "?? Web App Name: ${{ steps.deploy-bicep.outputs.webAppName }}"
          echo "?? Web App URL: ${{ steps.deploy-bicep.outputs.webAppUrl }}"

  # ========================================
  # JOB 3: Deploy Application to App Service
  # ========================================
  deploy-app:
    name: ?? Deploy Application
    runs-on: ubuntu-latest
    needs: [build, deploy-infrastructure]
    
    steps:
      - name: ?? Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

      - name: ?? Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ?? Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ needs.deploy-infrastructure.outputs.webapp-name }}
          package: ./publish

      - name: ?? Restart App Service (Force Refresh)
        run: |
          az webapp restart --name ${{ needs.deploy-infrastructure.outputs.webapp-name }} --resource-group ${{ env.RESOURCE_GROUP }}

  # ========================================
  # JOB 4: Health Check & Validation
  # ========================================
  health-check:
    name: ? Health Check
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, deploy-app]
    
    steps:
      - name: ? Wait for App Warmup (30s)
        run: sleep 30

      - name: ?? Check /health/ready Endpoint
        run: |
          URL="${{ needs.deploy-infrastructure.outputs.webAppUrl }}/health/ready"
          echo "?? Testing: $URL"
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $URL)
          
          if [ "$RESPONSE" -eq 200 ]; then
            echo "? Health check passed: HTTP $RESPONSE"
          else
            echo "? Health check failed: HTTP $RESPONSE"
            exit 1
          fi

      - name: ?? Check Swagger UI
        run: |
          URL="${{ needs.deploy-infrastructure.outputs.webAppUrl }}/swagger"
          echo "?? Testing: $URL"
          
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" $URL)
          
          if [ "$RESPONSE" -eq 200 ]; then
            echo "? Swagger accessible: HTTP $RESPONSE"
          else
            echo "?? Swagger check failed: HTTP $RESPONSE (non-blocking)"
          fi

      - name: ?? Deployment Summary
        run: |
          echo "========================================="
          echo "?? DÉPLOIEMENT RÉUSSI!"
          echo "========================================="
          echo ""
          echo "?? API URL        : ${{ needs.deploy-infrastructure.outputs.webAppUrl }}"
          echo "?? Swagger UI     : ${{ needs.deploy-infrastructure.outputs.webAppUrl }}/swagger"
          echo "?? Health Check   : ${{ needs.deploy-infrastructure.outputs.webAppUrl }}/health/ready"
          echo "?? Resource Group : ${{ env.RESOURCE_GROUP }}"
          echo ""
          echo "========================================="

# ========================================
# ?? Optimisations de coûts appliquées:
# - App Service Plan B1 (~13 USD/mois)
# - Pas de Redis (cache en mémoire)
# - Pas de Key Vault
# - Pas d'Application Insights
# - AlwaysOn désactivé
# - Artéfacts gardés 1 jour seulement
# - PostgreSQL externe (déjà existant)
# ========================================
