# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - smartoffice-prod-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      # ✅ AJOUT : working-directory
      - name: Build with dotnet
        run: dotnet build --configuration Release
        working-directory: ./SmartOfficeAPP/SmartOfficeAPP

      # ✅ AJOUT : working-directory
      - name: dotnet publish
        run: dotnet publish -c Release -o ${{github.workspace}}/myapp
        working-directory: ./SmartOfficeAPP/SmartOfficeAPP

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{github.workspace}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3953D953AF57495C90386562DF6906A1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F07F958119034C83B8572AE08EC6A975 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D39D7DB862FE4A88AD1334F2CE19E851 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'smartoffice-prod-api'
          slot-name: 'Production'
          package: .

      # ✅ NOUVEAU : Checkout pour migrations
      - name: Checkout code for migrations
        uses: actions/checkout@v4

      # ✅ NOUVEAU : Setup .NET pour migrations
      - name: Set up .NET Core for migrations
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      # ✅ NOUVEAU : Migrations EF Core
      - name: Run Entity Framework Migrations
        env:
          CONNECTION_STRING: ${{ secrets.POSTGRESQL_CONNECTION_STRING }}
        run: |
          echo "📦 Installing EF Core Tools..."
          dotnet tool install --global dotnet-ef --version 9.* || dotnet tool update --global dotnet-ef --version 9.*
          
          echo "🔄 Running database migrations..."
          dotnet ef database update --connection "$CONNECTION_STRING" || echo "⚠️ Migration failed or already applied"
        working-directory: ./SmartOfficeAPP/SmartOfficeAPP

      # ✅ NOUVEAU : Health Check
      - name: Health Check
        run: |
          echo "⏳ Waiting 30s for app to start..."
          sleep 30
          
          WEBAPP_URL="https://smartoffice-prod-api.azurewebsites.net"
          echo "🔍 Testing health endpoint: $WEBAPP_URL/health/ready"
          
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$WEBAPP_URL/health/ready" || echo "000")
          
          if [ "$HTTP_STATUS" == "200" ]; then
            echo "✅ Health check passed (HTTP $HTTP_STATUS)"
            echo "🌐 API URL: $WEBAPP_URL"
            echo "📖 Swagger: $WEBAPP_URL/swagger"
          else
            echo "⚠️ Health check returned HTTP $HTTP_STATUS"
            echo "ℹ️ App may still be starting up"
          fi
